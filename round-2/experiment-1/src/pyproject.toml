[project]
name = "checker-validation-experiment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "colorama==0.4.6",
    "emoji==2.15.0",
    "filelock==3.32.5",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.29.0",
    "idna==3.19",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "packaging==26.3",
    "platformdirs==4.11.6",
    "protobuf==7.36.1",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "regex==2026.9.3",
    "requests==2.34.2",
    "scipy==1.18.1",
    "setuptools==84.0.0",
    "stanza==1.14.0",
    "sympy==1.14.0",
    "termcolor==3.3.0",
    "torch==2.13.0",
    "tqdm==4.70.0",
    "typing-extensions==4.16.0",
    "udapi==0.5.2",
    "udtools==0.2.8",
    "urllib3==2.7.0",
]

# torch is installed from the CPU-only wheel index (no GPU driver compatible with a
# CUDA build was available at experiment time). stanza NER models (zh/ja/ru/uk)
# download on first use to ~/.cache/stanza via stanza.download(); no trained NER
# model exists in stanza for cs/is (checker_module.py falls back to a regex
# heuristic for those two languages, logged in the run output).

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
